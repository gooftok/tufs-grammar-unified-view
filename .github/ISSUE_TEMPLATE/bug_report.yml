name: 不具合の報告
description: 表示崩れや音声再生などの不具合を報告します
title: "[不具合] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        不具合報告の受付窓口です。把握できている範囲で記入してください。
        個人情報やパスワードなどの機密情報は含めないでください。

  - type: input
    id: page_url
    attributes:
      label: 不具合が発生したページのURL
      description: ブラウザのアドレスバーに表示されているURLを貼り付けてください。
      placeholder: https://www.coelang.tufs.ac.jp/mt/ko/gmod/...
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: 利用ブラウザ
      options:
        - Chrome
        - Edge
        - Firefox
        - その他
    validations:
      required: true

  - type: dropdown
    id: script_manager
    attributes:
      label: ユーザースクリプト管理拡張機能
      options:
        - Tampermonkey
        - Violentmonkey
        - その他
        - 不明
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 発生した現象・再現手順
      description: 操作手順と、発生した具体的な現象（エラー表示、レイアウト崩れなど）を記入してください。
      placeholder: |
        例:
        1. 例文ページを開いた
        2. 右側の再生ボタンを押した
        3. 音声が再生されなかった
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待していた動作
      placeholder: 例文の音声が再生される
    validations:
      required: false

  - type: textarea
    id: screenshot
    attributes:
      label: スクリーンショット
      description: 現象が確認できる画像がある場合は、ここにドラッグ＆ドロップしてください。

  - type: input
    id: version
    attributes:
      label: スクリプトのバージョン
      description: 不明な場合は空欄のままで構いません。
      placeholder: 0.3.0
